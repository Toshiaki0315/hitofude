name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # 配布対象が macOS 13+ なので CI も macOS で回す（spec §1.2）
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups


      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        # GUI テストは offscreen で動く（tests/conftest.py が強制する）。
        # faulthandler は「止まって見える」事象の保険——1 テストが 5 分を
        # 超えたら、そのテスト名と全スレッドのスタックがログに出る
        run: uv run pytest --cov --cov-report=term-missing -o faulthandler_timeout=300
