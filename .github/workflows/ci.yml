name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # 配布対象が macOS 13+ なので CI も macOS で回す（spec §1.2）
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups

      # 表は BIZ UDGothic で描く（ADR-0003:「全角＝半角×2」の前提）。
      # ランナーには入っていないので Google Fonts（SIL OFL）から入れる。
      # **コミットを固定**——main を追うと、フォント側の改版で桁の実測が
      # 静かに変わり、時期をまたいだ比較ができなくなる。
      #
      # `~/Library/Fonts` へ置くだけでは CoreText が拾わなかった（実測:
      # Menlo に落ちた）。ダウンロードだけして、プロセス内での登録は
      # tests/conftest.py（HITOFUDE_FONT_DIR）に任せる。引けることは
      # tests/test_fonts.py が名指しで確かめる
      - name: Download table font (BIZ UDGothic, SIL OFL)
        run: |
          FONTS=https://raw.githubusercontent.com/google/fonts/6ce172f74aa355ea43eb964fa4a91570a4d3064d/ofl/bizudgothic
          mkdir -p "$RUNNER_TEMP/hitofude-fonts"
          curl -sfL "$FONTS/BIZUDGothic-Regular.ttf" -o "$RUNNER_TEMP/hitofude-fonts/BIZUDGothic-Regular.ttf"
          curl -sfL "$FONTS/BIZUDGothic-Bold.ttf" -o "$RUNNER_TEMP/hitofude-fonts/BIZUDGothic-Bold.ttf"
          echo "HITOFUDE_FONT_DIR=$RUNNER_TEMP/hitofude-fonts" >> "$GITHUB_ENV"

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        # GUI テストは offscreen で動く（tests/conftest.py が強制する）
        run: uv run pytest --cov --cov-report=term-missing
