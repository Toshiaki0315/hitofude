[project]
name = "hitofude"
version = "0.1.0"
description = "ライブプレビュー型 Markdownエディタ"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "PySide6>=6.8,<6.10",
    "markdown-it-py>=4.0,<5",
    "PyYAML>=6.0,<7",
    "watchdog>=4.0,<7",
]

[project.scripts]
hitofude = "hitofude.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hitofude"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "gui: PySide6 のウィジェットを生成するテスト（QT_QPA_PLATFORM=offscreen が必要）",
    "slow: 実行に時間がかかるテスト（性能計測など）",
    "manual: 自動化できず手動チェックリストで担保するテスト（通常は skip）",
]
filterwarnings = ["error::DeprecationWarning:hitofude.*"]

[tool.coverage.run]
source = ["hitofude"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["hitofude", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff 固有
    "TID",  # flake8-tidy-imports
    "PTH",  # pathlib を使う
]
ignore = [
    "E501",    # line-length は formatter に任せる
    "RUF001",  # 全角文字を含む文字列（日本語コメント/テストで多用する）
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["hitofude"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# 設計原則（spec §6.1）: core/ と storage/ は PySide6 に依存させない。
# 違反は tests/test_architecture.py でも二重に検査する。
"PySide6.QtWidgets.QApplication.exec".msg = "テストからイベントループを回さないこと。qtbot を使う"

[tool.ruff.format]
quote-style = "double"
